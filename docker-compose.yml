# Optional: a real Postgres for local development. Without it the server uses an embedded
# PGlite database in apps/server/.data. To use this one:
#   docker compose up -d
#   echo 'DATABASE_URL=postgres://empire:empire@localhost:5432/empire' >> apps/server/.env
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: empire
      POSTGRES_PASSWORD: empire
      POSTGRES_DB: empire
    ports:
      - '5432:5432'
    volumes:
      - postgres:/var/lib/postgresql/data

volumes:
  postgres:
