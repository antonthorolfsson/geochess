    areaKm2: { value: 21, source: "Commonly cited land area (CBS, Wikipedia)" }
    gdpNominalUsd: { value: 96000000, year: 2023, source: "Statistics Netherlands (CBS)" }

  # --- Other small members of regions ------------------------------------------------------------
