# Subtractions that stop split-out parts from being counted twice.
adjustments:
  FRA:
    subtract: [GUF, GLP, MTQ, REU, MYT]
    stats: [population, gdpNominalUsd, gdpPppUsd]
    reason: the World Bank's France figures include the overseas departments, which play separately here
