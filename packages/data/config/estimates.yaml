    gdpNominalUsd: { value: 84537000, year: 2024, source: "CIA World Factbook (2024 estimate)" }
  BLM:
    population: { value: 10562, year: 2022, source: "INSEE, reference population 2022 (in force 1 January 2025)" }
    areaKm2: { value: 25, source: "CIA World Factbook" }
  VGB:
    gdpNominalUsd: { value: 1598000000, year: 2024, source: "CIA World Factbook (2024 estimate)" }
  COK:
